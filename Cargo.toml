[workspace]
resolver = "3"
members = [
    "crates/tokenzero-core",
    "crates/tokenzero-recovery",
    "crates/tokenzero-runtime",
    "crates/tokenzero-filters",
    "crates/tokenzero-mcp",
    "crates/tokenzero",
    "crates/tokenzero-install",
    "crates/tokenzero-pulse",
]

[workspace.package]
version = "1.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdityaVG13/tokenzero"
homepage = "https://github.com/AdityaVG13/tokenzero"
readme = "README.md"
keywords = ["llm", "context", "compression", "tokens", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.2"
clap = { version = "4.6.1", features = ["derive", "env"] }
globset = "0.4.18"
memchr = "2.8.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
predicates = "3.1.4"
proptest = "1.11.0"
regex = "1.12.3"
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
similar = { version = "2.7.0", default-features = false, features = ["text"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rquickjs = { version = "0.10.0", features = ["full", "macro"] }
fs4 = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
wait-timeout = "0.2.1"
fastmcp-rust = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c66097b15dea9550e833ee9e433beeb66eefece" }

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
