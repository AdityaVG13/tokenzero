[workspace]
resolver = "3"
members = [
    "crates/tokenzero-core",
    "crates/tokenzero-recovery",
    "crates/tokenzero-runtime",
    "crates/tokenzero-engine",
    "crates/tokenzero-filters",
    "crates/tokenzero-codemode",
    "crates/tokenzero-mcp-compat",
    "crates/tokenzero-test-support",
    "crates/tokenzero",
    "crates/tokenzero-install",
    "crates/tokenzero-pulse",
    "tests",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdityaVG13/tokenzero"
homepage = "https://github.com/AdityaVG13/tokenzero"
readme = "README.md"
keywords = ["llm", "context", "compression", "tokens", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
globset = "0.4.20"
memchr = "2.8.3"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
predicates = "3.1.4"
proptest = "1.11.0"
regex = "1.13.1"
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.1.2", default-features = false, features = ["text"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
fs4 = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
wait-timeout = "0.2.1"
zero-abi = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-gauge = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-ledger = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-ref = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-process = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-store = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc" }
zero-testkit = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc", default-features = false }
# Hub-owned MCP transport authority (replaces the retired zero-codemode fastmcp carrier).
zero-mcp = { git = "https://github.com/AdityaVG13/zerostack", rev = "bd721f7fc4866b24dec0c552da3d96bd8d816fbc", features = ["fastmcp"] }

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
