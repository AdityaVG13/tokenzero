name: development-contract

# MANUAL ONLY (workflow_dispatch). Per repo policy, no automatic triggers on
# push or pull_request: automatic runs on every commit burn the GitHub Actions
# budget. Run from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-xtask:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask doctor --json
      - run: cargo xtask understand --check
      - run: cargo test --manifest-path xtask/Cargo.toml
