name: RADC Cont-2 (optional)

# Formal-regression lane only. MANUAL. Never a product-release gate.
# Does not run on push, pull_request, or schedule.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radc-check:
    name: formal Cont-2 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Reproduce Cont-2 certificates
        run: python3 scripts/radc-check
