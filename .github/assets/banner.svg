<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-label="TokenZero - Recovery-Aware Context Compression">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="240 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="10" fill="url(#bg)" stroke="#21262d" stroke-width="2"/>

  <text x="80" y="116" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="82" fill="url(#accent)">TokenZero</text>
  <text x="84" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="21" fill="#c9d1d9">Recovery-Aware Context Compression</text>
  <text x="84" y="204" font-family="'Cascadia Code',Consolas,monospace" font-weight="600" font-size="23" fill="#58a6ff">Compress aggressively.&#160;&#160;Recover exactly.&#160;&#160;One install.</text>

  <!-- capsule glyph -->
  <g transform="translate(960,42)">
    <rect x="0" y="0" width="176" height="176" rx="26" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <circle cx="34" cy="34" r="6" fill="#3fb950"/>
    <circle cx="54" cy="34" r="6" fill="#d29922"/>
    <circle cx="74" cy="34" r="6" fill="#f85149"/>
    <text x="88" y="120" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="80" fill="url(#accent)">tz</text>
    <text x="88" y="152" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#7d8590">tz://blob/&#8230;</text>
  </g>
</svg>
