<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" fill="none" role="img" aria-label="License">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="0.42" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a371f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="subclip">
      <rect x="1047" y="64" width="0" height="32">
        <animate attributeName="width" values="0;0;129;129" keyTimes="0;0.1111;0.3333;1" dur="2.7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="140" fill="url(#band)"/>
  <rect x="0" y="0" width="7" height="140" fill="url(#acc)"/>
  <text x="44" y="90" font-family="Segoe UI, Arial" font-weight="800" font-size="54" fill="#f0f6fc">License</text>
  <g clip-path="url(#subclip)">
    <text x="1176" y="86" text-anchor="end" font-family="Consolas, monospace" font-size="18" fill="#8b949e">MIT licensed</text>
  </g>
  <rect x="0" y="136" width="1200" height="4" fill="url(#rule)"/>
</svg>
