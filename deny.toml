# cargo-deny supply-chain policy for TokenZero.
# Run: cargo deny check   (advisories + licenses + bans + sources)
# The allow-list below is exactly the set of permissive, OSI-approved licenses
# present in the dependency tree (verified via `cargo metadata`); all are
# compatible with TokenZero's own MIT license.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
