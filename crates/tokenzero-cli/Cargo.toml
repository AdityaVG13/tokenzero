[package]
name = "tokenzero-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenZero CLI: token-efficient file read/search/shell with exact recovery."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false
autobins = false

# Classic MCP remains an explicit compatibility feature. Aggregate CodeMode
# execution belongs to ZeroStack; this CLI embeds no planner or JavaScript host.
[features]
default = []
surface-mcp = ["dep:tokenzero-mcp-compat", "tokenzero-mcp-compat/surface-mcp", "tokenzero-install/surface-mcp"]

[[bin]]
name = "tokenzero"
path = "src/main.rs"

[[bin]]
name = "tokenzero-mcp"
path = "src/bin/tokenzero_mcp.rs"
required-features = ["surface-mcp"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-engine = { path = "../tokenzero-engine", version = "1.0.2" }
tokenzero-install = { path = "../tokenzero-install", version = "1.0.2", default-features = false }
tokenzero-mcp-compat = { path = "../tokenzero-mcp-compat", version = "1.0.2", default-features = false, optional = true }
tokenzero-pulse = { path = "../tokenzero-pulse", version = "1.0.2" }
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }
tokenzero-runtime = { path = "../tokenzero-runtime", version = "1.0.2" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokenzero-test-support = { path = "../tokenzero-test-support" }

# Relocated standalone tests live under the workspace tests/ tree.
[[test]]
name = "cli_help_contract"
path = "../../tests/cli/cli_help_contract.rs"

[[test]]
name = "cli_tools_io"
path = "../../tests/cli/cli_tools_io.rs"

[[test]]
name = "gate_c_retirement_contract"
path = "../../tests/cli/gate_c_retirement_contract.rs"

[[test]]
name = "golden_outputs"
path = "../../tests/cli/golden_outputs.rs"

[[test]]
name = "irx9_surface_bench_process"
path = "../../tests/cli/irx9_surface_bench_process.rs"

[[test]]
name = "irx9_transport_matrix"
path = "../../tests/cli/irx9_transport_matrix.rs"

[[test]]
name = "mcp_transport"
path = "../../tests/cli/mcp_transport.rs"

[[test]]
name = "packaging_e2e"
path = "../../tests/cli/packaging_e2e.rs"

[[test]]
name = "packaging_lifecycle"
path = "../../tests/cli/packaging_lifecycle.rs"

[[test]]
name = "passthrough_conformance"
path = "../../tests/cli/passthrough_conformance.rs"

[[test]]
name = "raw_worker_packaged_conformance"
path = "../../tests/cli/raw_worker_packaged_conformance.rs"

[[test]]
name = "store_root_precedence"
path = "../../tests/cli/store_root_precedence.rs"

[[test]]
name = "surface_arg_rejection"
path = "../../tests/cli/surface_arg_rejection.rs"
