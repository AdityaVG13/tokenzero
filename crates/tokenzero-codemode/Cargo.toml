[package]
name = "tokenzero-codemode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone TokenZero CodeMode runtime over the canonical dispatcher."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# js (default) links the QuickJS runtime; without it the crate compiles a
# fail-closed exec stub so surface adapters can still serve the catalog.
[features]
default = ["js"]
js = ["dep:rquickjs"]

[dependencies]
fs4.workspace = true
rquickjs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zerostack-machine-permit.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-engine = { path = "../tokenzero-engine", version = "1.0.2" }
tokenzero-filters = { path = "../tokenzero-filters", version = "1.0.2" }
tokenzero-pulse = { path = "../tokenzero-pulse", version = "1.0.2" }
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }
