[package]
name = "tokenzero-recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded recovery cache with exact byte-recovery for TokenZero refs."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
fs4.workspace = true
getrandom = "0.2"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zero-ref.workspace = true
zero-store.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
criterion = "0.8"
tokenzero-test-support = { path = "../tokenzero-test-support" }

[[bench]]
