[package]
name = "tokenzero-mcp-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing TokenZero read/find/tree/expand/shell tools."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

# Classic MCP compatibility uses the hub-owned FastMCP transport. Aggregate
# CodeMode execution remains in ZeroStack and is not embedded in this crate.
[features]
default = ["surface-mcp"]
surface-mcp = ["zero-mcp/fastmcp"]

[dependencies]
fs4.workspace = true
globset.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-engine = { path = "../tokenzero-engine", version = "1.0.2" }
zero-abi.workspace = true
zero-mcp = { workspace = true, features = ["fastmcp"] }

[dev-dependencies]
assert_cmd.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }

# Relocated standalone tests live under the workspace tests/ tree.
[[test]]
name = "mcp_jsonrpc_conformance"
path = "../../tests/mcp-compat/jsonrpc_conformance.rs"
