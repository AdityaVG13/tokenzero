[package]
name = "tokenzero-mcp-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing TokenZero read/find/tree/expand/shell tools."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Mutually exclusive package surfaces (tokenzero-irx9.3).
# Exactly one surface may be enabled per process/artifact — never both.
# Enabling both triggers a compile_error in lib.rs (process mutual exclusion).
# Default is FastMCP only (native CodeMode clients install tokenzero-mcp).
# CodeMode artifact: --no-default-features --features surface-codemode
[features]
default = ["surface-mcp"]
surface-mcp = ["dep:fastmcp-rust"]

[dependencies]
fs4.workspace = true
globset.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tempfile.workspace = true
zerostack-machine-permit.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-filters = { path = "../tokenzero-filters", version = "1.0.2" }
tokenzero-pulse = { path = "../tokenzero-pulse", version = "1.0.2" }
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }
tokenzero-runtime = { path = "../tokenzero-runtime", version = "1.0.2" }
tokenzero-engine = { path = "../tokenzero-engine", version = "1.0.2" }
fastmcp-rust = { workspace = true, optional = true }

[dev-dependencies]
tokenzero-codemode = { path = "../tokenzero-codemode" }
assert_cmd.workspace = true
proptest.workspace = true
