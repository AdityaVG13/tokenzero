[package]
name = "tokenzero-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenZero CLI: token-efficient file read/search/shell with exact recovery."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autobins = false

# Mutually exclusive package surfaces (tokenzero-irx9.3).
# Exactly one surface per process/artifact — enabling both is a compile error.
# Legacy adapters remain explicit compatibility features. The canonical CLI
# defaults to no MCP, planner, JavaScript, or engine-local CodeMode host.
[features]
default = []
surface-mcp = ["dep:tokenzero-mcp-compat", "tokenzero-mcp-compat/surface-mcp", "tokenzero-install/surface-mcp"]
surface-codemode = ["dep:tokenzero-codemode", "tokenzero-codemode/surface-codemode", "tokenzero-install/surface-codemode"]

[[bin]]
name = "tokenzero"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-filters = { path = "../tokenzero-filters", version = "1.0.2" }
tokenzero-engine = { path = "../tokenzero-engine", version = "1.0.2" }
tokenzero-install = { path = "../tokenzero-install", version = "1.0.2", default-features = false }
tokenzero-mcp-compat = { path = "../tokenzero-mcp-compat", version = "1.0.2", default-features = false, optional = true }
tokenzero-codemode = { package = "tokenzero-worker", path = "../tokenzero-codemode", version = "1.4.0", default-features = false, optional = true }
tokenzero-pulse = { path = "../tokenzero-pulse", version = "1.0.2" }
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }
tokenzero-runtime = { path = "../tokenzero-runtime", version = "1.0.2" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true
