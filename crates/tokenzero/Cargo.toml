[package]
name = "tokenzero"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenZero CLI: token-efficient file read/search/shell with exact recovery."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Mutually exclusive package surfaces (tokenzero-irx9.3).
# Exactly one surface per process/artifact — enabling both is a compile error.
# Default is surface-mcp only (selection matrix: native CodeMode clients).
# CodeMode: --no-default-features --features surface-codemode
# Production `tokenzero` is a selected symlink to one surface artifact, never
# a dual-catalog binary.
[features]
default = ["surface-mcp"]
surface-mcp = ["tokenzero-mcp-compat/surface-mcp", "tokenzero-install/surface-mcp"]
surface-codemode = ["dep:tokenzero-codemode", "tokenzero-codemode/js", "tokenzero-install/surface-codemode"]

[[bin]]
name = "tokenzero"
path = "src/main.rs"

[[bin]]
name = "tokenzero-mcp"
path = "src/bin/tokenzero_mcp.rs"
required-features = ["surface-mcp"]

[[bin]]
name = "tokenzero-codemode"
path = "src/bin/tokenzero_codemode.rs"
required-features = ["surface-codemode"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
tokenzero-filters = { path = "../tokenzero-filters", version = "1.0.2" }
tokenzero-install = { path = "../tokenzero-install", version = "1.0.2", default-features = false }
tokenzero-mcp-compat = { path = "../tokenzero-mcp-compat", version = "1.0.2", default-features = false }
tokenzero-codemode = { path = "../tokenzero-codemode", version = "1.4.0", default-features = false, optional = true }
tokenzero-pulse = { path = "../tokenzero-pulse", version = "1.0.2" }
tokenzero-recovery = { path = "../tokenzero-recovery", version = "1.0.2" }
tokenzero-runtime = { path = "../tokenzero-runtime", version = "1.0.2" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true
